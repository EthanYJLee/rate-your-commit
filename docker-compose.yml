services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rateyourcommit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rateyourcommit}
      POSTGRES_DB: ${POSTGRES_DB:-rateyourcommit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port published on purpose — web/worker reach Postgres over
    # the internal Docker network only. Publishing 5432 to the host by
    # default is a real footgun for anyone deploying on a cloud VM
    # without their own firewall rules, especially paired with the
    # POSTGRES_PASSWORD default above. Uncomment only if you specifically
    # need host-machine access (e.g. `psql` from outside the containers)
    # AND you've set a real POSTGRES_PASSWORD in .env:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rateyourcommit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rateyourcommit}:${POSTGRES_PASSWORD:-rateyourcommit}@postgres:5432/${POSTGRES_DB:-rateyourcommit}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rateyourcommit}:${POSTGRES_PASSWORD:-rateyourcommit}@postgres:5432/${POSTGRES_DB:-rateyourcommit}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
